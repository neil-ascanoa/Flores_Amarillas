<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Para ti ✨🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #020408;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Proporción 9:16 vertical para historias y estados */
    #canvas-container {
      position: relative;
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      max-height: 900px;
      background: radial-gradient(circle at 50% 40%, #151104 0%, #05070d 65%, #010206 100%);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Dedicatoria estética con fondo esmerilado */
    #message-box {
      position: absolute;
      bottom: 6%;
      left: 6%;
      right: 6%;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(253, 224, 71, 0.35);
      border-radius: 20px;
      padding: 20px 18px;
      text-align: center;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(250, 204, 21, 0.15);
    }

    #message-box.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #message-box h2 {
      color: #fef08a;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-shadow: 0 0 16px rgba(250, 204, 21, 0.6);
      margin-bottom: 8px;
    }

    #message-box p {
      color: #f1f5f9;
      font-size: 0.95rem;
      line-height: 1.5;
      font-weight: 300;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Pantalla táctil de bienvenida */
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(2, 4, 8, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: radial-gradient(circle, #fde047 0%, #ca8a04 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.3rem;
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.65);
      animation: pulse 1.8s infinite ease-in-out;
      margin-bottom: 22px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #start-screen h3 {
      color: #fef08a;
      font-size: 1.25rem;
      letter-spacing: 2px;
      font-weight: 600;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
    }

    #start-screen p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    /* Botones de control */
    .controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .icon-btn {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(254, 240, 138, 0.3);
      color: #fef08a;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1.1rem;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      transform: scale(1.1);
      background: rgba(30, 41, 59, 0.85);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(250, 204, 21, 0.5); }
      50% { transform: scale(1.1); box-shadow: 0 0 45px rgba(250, 204, 21, 0.85); }
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    
    <!-- Audio de fondo -->
    <audio id="bgMusic" loop preload="auto">
      <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <div class="controls">
      <button class="icon-btn" id="soundBtn" title="Silenciar / Activar audio">🔊</button>
      <button class="icon-btn" id="replayBtn" title="Reiniciar">↻</button>
      <button class="icon-btn" id="fullBtn" title="Pantalla completa">⛶</button>
    </div>

    <!-- Pantalla interactiva previa -->
    <div id="start-screen">
      <button class="start-btn" id="realStartBtn">🌻</button>
      <h3>TOCA LA PANTALLA</h3>
      <p>Sube el volumen para una mejor experiencia</p>
    </div>

    <canvas id="canvas"></canvas>

    <!-- Dedicatoria final -->
    <div id="message-box">
      <h2>ERES ESPECIAL ✨🌻</h2>
      <p>
        Para todas aquellas personas que no recibieron sus flores, déjenme decirles que son increíbles y que disfruten mucho este día.
      </p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');
    const startScreen = document.getElementById('start-screen');
    const realStartBtn = document.getElementById('realStartBtn');
    const messageBox = document.getElementById('message-box');
    const bgMusic = document.getElementById('bgMusic');
    const soundBtn = document.getElementById('soundBtn');
    const replayBtn = document.getElementById('replayBtn');
    const fullBtn = document.getElementById('fullBtn');

    let width, height;
    function resize() {
      width = canvas.width = container.clientWidth;
      height = canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let animationStage = 'waiting'; // waiting, launch, blooming, steady
    let bouquetProgress = 0;
    let isMuted = false;

    let rockets = [];
    let fireworkParticles = [];
    let sparkles = [];

    // Partículas ambientales de fondo
    const stars = Array.from({ length: 45 }, () => ({
      x: Math.random() * 440,
      y: Math.random() * 900,
      r: Math.random() * 2 + 0.8,
      alpha: Math.random() * 0.6 + 0.2,
      pulse: Math.random() * 0.03 + 0.01
    }));

    // Cientos de partículas de polvo dorado sobre el ramo (como en la captura 1)
    const goldClusterParticles = Array.from({ length: 180 }, () => {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.pow(Math.random(), 0.6) * 145;
      return {
        relX: Math.cos(angle) * radius,
        relY: Math.sin(angle) * (radius * 0.75) - 60,
        r: Math.random() * 2.8 + 1,
        baseAlpha: Math.random() * 0.8 + 0.25,
        speed: Math.random() * 0.04 + 0.02,
        offset: Math.random() * Math.PI * 2
      };
    });

    window.addEventListener('DOMContentLoaded', () => {
      bgMusic.load();
    });

    function executeStart(e) {
      if (e) e.stopPropagation();
      if (animationStage !== 'waiting') return;

      bgMusic.muted = false;
      const promise = bgMusic.play();
      if (promise !== undefined) {
        promise.catch(() => {
          setTimeout(() => bgMusic.play().catch(() => {}), 100);
        });
      }

      startScreen.classList.add('hidden');
      launchSequence();
    }

    realStartBtn.addEventListener('click', executeStart);
    realStartBtn.addEventListener('touchend', executeStart);
    startScreen.addEventListener('click', executeStart);

    function launchSequence() {
      animationStage = 'launch';
      messageBox.classList.remove('visible');
      bouquetProgress = 0;
      rockets = [];
      fireworkParticles = [];
      sparkles = [];

      // Cohetes hacia el centro
      rockets.push({ x: width * 0.5, y: height, targetY: height * 0.42, speed: 13, trail: [] });
      rockets.push({ x: width * 0.44, y: height, targetY: height * 0.46, speed: 12.5, trail: [] });
      rockets.push({ x: width * 0.56, y: height, targetY: height * 0.45, speed: 12, trail: [] });
    }

    function explodeRockets(x, y) {
      for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        fireworkParticles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: Math.random() > 0.3 ? '#facc15' : (Math.random() > 0.5 ? '#fef08a' : '#fbbf24'),
          alpha: 1,
          size: Math.random() * 3 + 1.5
        });
      }
      animationStage = 'blooming';
    }

    /* ==========================================================
       DIBUJO DEL RAMO EXACTO AL MODELO 1 (CAPAS + SEMILLAS + RESPLANDOR)
       ========================================================== */
    function drawModelOneSunflower(x, y, radius, petalLayers, isCenterBig) {
      ctx.save();
      ctx.translate(x, y);

      // Resplandor cálido exterior por flor
      const aura = ctx.createRadialGradient(0, 0, radius * 0.4, 0, 0, radius * 1.35);
      aura.addColorStop(0, 'rgba(250, 204, 21, 0.4)');
      aura.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, radius * 1.35, 0, Math.PI * 2);
      ctx.fill();

      // Múltiples capas de pétalos afilados definidos (idénticos a la foto 1)
      const layers = petalLayers || [
        { count: 28, length: radius, widthRatio: 0.16, color1: '#ca8a04', color2: '#fde047', rotOffset: 0 },
        { count: 28, length: radius * 0.88, widthRatio: 0.15, color1: '#eab308', color2: '#fef08a', rotOffset: 0.11 },
        { count: 24, length: radius * 0.74, widthRatio: 0.14, color1: '#f59e0b', color2: '#fffbeb', rotOffset: 0.22 }
      ];

      layers.forEach(layer => {
        const step = (Math.PI * 2) / layer.count;
        for (let i = 0; i < layer.count; i++) {
          const angle = i * step + layer.rotOffset;
          ctx.save();
          ctx.rotate(angle);

          const l = layer.length;
          const w = l * layer.widthRatio;

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(-w, l * 0.45, 0, l);
          ctx.quadraticCurveTo(w, l * 0.45, 0, 0);

          const grad = ctx.createLinearGradient(0, 0, 0, l);
          grad.addColorStop(0, layer.color1);
          grad.addColorStop(0.7, layer.color2);
          grad.addColorStop(1, '#ffffff');
          ctx.fillStyle = grad;
          ctx.fill();

          // Nervadura central fina del pétalo
          ctx.beginPath();
          ctx.moveTo(0, l * 0.15);
          ctx.lineTo(0, l * 0.85);
          ctx.strokeStyle = 'rgba(202, 138, 4, 0.5)';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.restore();
        }
      });

      // Centro oscuro de semillas con corona de textura
      const centerR = radius * (isCenterBig ? 0.38 : 0.35);

      // Disco base
      const centerGrad = ctx.createRadialGradient(0, 0, centerR * 0.1, 0, 0, centerR);
      centerGrad.addColorStop(0, '#1c0d02');
      centerGrad.addColorStop(0.65, '#381604');
      centerGrad.addColorStop(0.9, '#5c2406');
      centerGrad.addColorStop(1, '#853207');

      ctx.beginPath();
      ctx.arc(0, 0, centerR, 0, Math.PI * 2);
      ctx.fillStyle = centerGrad;
      ctx.fill();

      // Semillas punteadas concéntricas / Fibonacci
      const goldenAngle = 137.5 * (Math.PI / 180);
      const totalSeeds = isCenterBig ? 130 : 90;
      for (let n = 1; n < totalSeeds; n++) {
        const r = (centerR - 2) * Math.sqrt(n / totalSeeds);
        const theta = n * goldenAngle;
        const sx = r * Math.cos(theta);
        const sy = r * Math.sin(theta);

        ctx.beginPath();
        ctx.arc(sx, sy, isCenterBig ? 1.6 : 1.3, 0, Math.PI * 2);
        ctx.fillStyle = n > totalSeeds * 0.65 ? '#ca8a04' : (n > totalSeeds * 0.3 ? '#854d0e' : '#291104');
        ctx.fill();
      }

      // Anillo de brillo borde del centro
      ctx.beginPath();
      ctx.arc(0, 0, centerR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(254, 240, 138, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function drawModelOneBouquet(cx, cy, scale, progress) {
      if (progress <= 0) return;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale * progress, scale * progress);

      // Leve respiración orgánica
      const sway = Math.sin(Date.now() * 0.0018) * 0.02;
      ctx.rotate(sway);

      // 1. GRAN AURA DORADA DETRÁS DEL RAMO (como en la foto 1)
      const bigAura = ctx.createRadialGradient(0, -40, 30, 0, -40, 260);
      bigAura.addColorStop(0, 'rgba(250, 204, 21, 0.55)');
      bigAura.addColorStop(0.5, 'rgba(234, 179, 8, 0.25)');
      bigAura.addColorStop(1, 'rgba(234, 179, 8, 0)');
      ctx.fillStyle = bigAura;
      ctx.beginPath();
      ctx.arc(0, -40, 260, 0, Math.PI * 2);
      ctx.fill();

      // 2. TALLOS VERDES ESMERALDA DELGADOS Y ELEGANTES
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = '#059669';
      ctx.lineCap = 'round';
      for (let i = -5; i <= 5; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 3.5, 40);
        ctx.quadraticCurveTo(i * 4.5, 120, i * 6.5, 210);
        ctx.stroke();
      }

      // 3. HOJAS VERDES BRILLANTES TIPO LANCEOLADAS (Foto 1)
      function drawCleanLeaf(lx, ly, rot, s) {
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate(rot);
        ctx.scale(s, s);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(28, -18, 55, 0);
        ctx.quadraticCurveTo(28, 18, 0, 0);
        const grad = ctx.createLinearGradient(0, -18, 55, 18);
        grad.addColorStop(0, '#34d399');
        grad.addColorStop(0.5, '#10b981');
        grad.addColorStop(1, '#065f46');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();
      }

      drawCleanLeaf(-75, -20, -0.65, 1.25);
      drawCleanLeaf(75, -20, 0.65, 1.25);
      drawCleanLeaf(-105, -70, -1.05, 1.15);
      drawCleanLeaf(105, -70, 1.05, 1.15);
      drawCleanLeaf(0, -120, -1.57, 1.3);

      // 4. ROSAS CONCÉNTRICAS AMARILLAS DULCES DE FONDO (Foto 1)
      function drawBackRose(rx, ry, r) {
        ctx.save();
        ctx.translate(rx, ry);
        for (let ring = 5; ring >= 1; ring--) {
          const rad = (ring / 5) * r;
          ctx.beginPath();
          ctx.arc(0, 0, rad, 0, Math.PI * 2);
          ctx.fillStyle = ring % 2 === 0 ? '#facc15' : '#eab308';
          ctx.shadowColor = 'rgba(202, 138, 4, 0.4)';
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        ctx.restore();
      }

      drawBackRose(0, -95, 48);
      drawBackRose(-55, -75, 44);
      drawBackRose(55, -75, 44);

      // 5. GIRASOLES SUPERIORES Y LATERALES (Foto 1)
      drawModelOneSunflower(-68, -25, 62, null, false);
      drawModelOneSunflower(68, -25, 62, null, false);
      drawModelOneSunflower(0, -85, 54, null, false);

      // 6. GRAN GIRASOL CENTRAL DOMINANTE (Foto 1)
      drawModelOneSunflower(0, 5, 88, null, true);

      // 7. LAZO NEGRO DE SATÉN CON FILO DORADO Y CAÍDAS FINAS (Foto 1)
      ctx.save();
      ctx.translate(0, 85);

      // Lazadas
      ctx.lineWidth = 11;
      ctx.strokeStyle = '#05070d';
      ctx.beginPath();
      ctx.ellipse(-30, -5, 25, 13, -0.28, 0, Math.PI * 2);
      ctx.ellipse(30, -5, 25, 13, 0.28, 0, Math.PI * 2);
      ctx.stroke();

      // Borde dorado en las lazadas
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#facc15';
      ctx.stroke();

      // Nudo ovalado
      ctx.beginPath();
      ctx.ellipse(0, 0, 13, 10, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#05070d';
      ctx.fill();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#fef08a';
      ctx.stroke();

      // Caídas largas estilizadas
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#05070d';
      ctx.beginPath();
      ctx.moveTo(-5, 8);
      ctx.quadraticCurveTo(-22, 60, -30, 98);
      ctx.moveTo(5, 8);
      ctx.quadraticCurveTo(22, 60, 30, 98);
      ctx.stroke();

      ctx.lineWidth = 1.8;
      ctx.strokeStyle = '#facc15';
      ctx.stroke();

      ctx.restore();

      // 8. CIENTOS DE CHISPAS Y POLVO DORADO SOBRE EL RAMO (Efecto Foto 1)
      const t = Date.now() * 0.002;
      goldClusterParticles.forEach(p => {
        const py = p.relY + Math.sin(t + p.offset) * 6;
        const px = p.relX + Math.cos(t + p.offset) * 4;
        const currentAlpha = p.baseAlpha * (0.6 + 0.4 * Math.sin(t * 2 + p.offset));

        ctx.beginPath();
        ctx.arc(px, py, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 240, 138, ${currentAlpha})`;
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      ctx.restore();
    }

    // Bucle continuo
    function loop() {
      ctx.clearRect(0, 0, width, height);

      // 1. Estrellas de fondo
      stars.forEach(s => {
        s.alpha += s.pulse;
        if (s.alpha > 0.8 || s.alpha < 0.2) s.pulse *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 240, 138, ${s.alpha})`;
        ctx.fill();
      });

      // 2. Cohetes
      if (animationStage === 'launch') {
        rockets.forEach(r => {
          r.trail.push({ x: r.x, y: r.y, alpha: 1 });
          r.y -= r.speed;

          r.trail.forEach(t => {
            t.alpha -= 0.05;
            ctx.beginPath();
            ctx.arc(t.x + (Math.random() - 0.5) * 4, t.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(250, 204, 21, ${t.alpha})`;
            ctx.fill();
          });
          r.trail = r.trail.filter(t => t.alpha > 0);

          ctx.beginPath();
          ctx.arc(r.x, r.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 15;
          ctx.fill();
          ctx.shadowBlur = 0;

          if (r.y <= r.targetY) {
            explodeRockets(width * 0.5, height * 0.44);
            rockets = [];
          }
        });
      }

      // 3. Chispas de la detonación
      if (fireworkParticles.length > 0) {
        fireworkParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
          p.alpha -= 0.016;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
        });
        fireworkParticles = fireworkParticles.filter(p => p.alpha > 0);
      }

      // 4. Ramo floreciendo y resplandeciendo
      if (animationStage === 'blooming' || animationStage === 'steady') {
        if (bouquetProgress < 1) {
          bouquetProgress += 0.02;
          if (bouquetProgress >= 1) {
            bouquetProgress = 1;
            animationStage = 'steady';
            messageBox.classList.add('visible');
          }
        }
        drawModelOneBouquet(width * 0.5, height * 0.44, 1.12, bouquetProgress);
      }

      // 5. Destellos mágicos al tocar
      sparkles.forEach(sp => {
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.alpha -= 0.03;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 240, 138, ${sp.alpha})`;
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
      sparkles = sparkles.filter(sp => sp.alpha > 0);

      requestAnimationFrame(loop);
    }
    loop();

    function addTouchSparkles(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      for (let i = 0; i < 15; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        sparkles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 1,
          alpha: 1
        });
      }
    }
    canvas.addEventListener('click', addTouchSparkles);
    canvas.addEventListener('touchstart', addTouchSparkles);

    // Controles
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      bgMusic.muted = isMuted;
      soundBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    // Al reiniciar, la música no se corta
    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (bgMusic.paused) {
        bgMusic.play().catch(() => {});
      }
      launchSequence();
    });

    fullBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
