<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Para ti ✨🌻</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #030712;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Formato Vertical para Estado (9:16) */
    #container {
      position: relative;
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      max-height: 920px;
      background: radial-gradient(circle at 50% 35%, #1c1404 0%, #080c18 65%, #020409 100%);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
    }

    /* Lienzo para partículas y fuegos artificiales */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* Ramo realista con sombreado volumétrico y lazo */
    .bouquet-wrapper {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.65);
      width: 380px;
      height: 480px;
      opacity: 0;
      filter: drop-shadow(0 0 35px rgba(250, 204, 21, 0.45));
      transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 4;
      pointer-events: none;
    }

    .bouquet-wrapper.revealed {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: floatBreath 5s ease-in-out infinite alternate;
    }

    @keyframes floatBreath {
      0% {
        transform: translate(-50%, -50%) scale(1) rotate(-0.5deg);
      }
      100% {
        transform: translate(-50%, -52%) scale(1.025) rotate(0.8deg);
      }
    }

    /* Mensaje final */
    #message-box {
      position: absolute;
      bottom: 7%;
      left: 7%;
      right: 7%;
      background: rgba(13, 19, 36, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(253, 224, 71, 0.35);
      border-radius: 20px;
      padding: 22px 18px;
      text-align: center;
      opacity: 0;
      transform: translateY(35px) scale(0.95);
      transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(250, 204, 21, 0.15);
    }

    #message-box.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #message-box h2 {
      color: #fef08a;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 16px rgba(250, 204, 21, 0.7);
      margin-bottom: 8px;
    }

    #message-box p {
      color: #f8fafc;
      font-size: 0.95rem;
      line-height: 1.55;
      font-weight: 300;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* Pantalla inicial para desbloquear audio del móvil */
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-btn {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, #fde047 0%, #ca8a04 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      box-shadow: 0 0 40px rgba(250, 204, 21, 0.7);
      animation: pulse 1.8s infinite ease-in-out;
      margin-bottom: 22px;
    }

    #start-screen h3 {
      color: #fef08a;
      font-size: 1.25rem;
      letter-spacing: 2px;
      font-weight: 600;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
    }

    #start-screen p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    /* Botones de control */
    .controls {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .icon-btn {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(254, 240, 138, 0.35);
      color: #fef08a;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1.1rem;
      backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }

    .icon-btn:hover {
      transform: scale(1.1);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(250, 204, 21, 0.5); }
      50% { transform: scale(1.1); box-shadow: 0 0 45px rgba(250, 204, 21, 0.85); }
    }
  </style>
</head>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');
    const startScreen = document.getElementById('start-screen');
    const messageBox = document.getElementById('message-box');
    const bouquet = document.getElementById('bouquet');
    const bgMusic = document.getElementById('bgMusic');
    const soundBtn = document.getElementById('soundBtn');
    const replayBtn = document.getElementById('replayBtn');
    const fullBtn = document.getElementById('fullBtn');

    let width, height;
    function resize() {
      width = canvas.width = container.clientWidth;
      height = canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let animationState = 'waiting';
    let rockets = [];
    let particles = [];
    let sparkles = [];
    let isMuted = false;

    // Bokeh de fondo
    const ambientBokeh = Array.from({ length: 35 }, () => ({
      x: Math.random() * 440,
      y: Math.random() * 920,
      r: Math.random() * 3 + 1,
      alpha: Math.random() * 0.6 + 0.2,
      pulse: Math.random() * 0.02 + 0.008
    }));

    // Inicio de experiencia al tocar
    function handleStart() {
      if (animationState !== 'waiting') return;
      startScreen.classList.add('hidden');
      bgMusic.play().catch(e => console.log('Audio autoplay:', e));
      startFireworks();
    }

    startScreen.addEventListener('click', handleStart);
    startScreen.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleStart();
    });

    function startFireworks() {
      animationState = 'launching';
      messageBox.classList.remove('visible');
      bouquet.classList.remove('revealed');
      rockets = [];
      particles = [];
      sparkles = [];

      // Lanzar 3 fuegos artificiales ascendentes
      rockets.push({ x: width * 0.5, y: height, targetY: height * 0.44, speed: 13, trail: [] });
      rockets.push({ x: width * 0.42, y: height, targetY: height * 0.48, speed: 12.2, trail: [] });
      rockets.push({ x: width * 0.58, y: height, targetY: height * 0.47, speed: 11.8, trail: [] });
    }

    // Detonación dorada
    function explode(x, y) {
      for (let i = 0; i < 220; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3.2 + 1.2,
          color: Math.random() > 0.35 ? '#facc15' : (Math.random() > 0.5 ? '#fef08a' : '#f59e0b'),
          alpha: 1,
          decay: Math.random() * 0.016 + 0.012
        });
      }

      animationState = 'exploded';

      // Revelar el ramo con destello orgánico
      setTimeout(() => {
        bouquet.classList.add('revealed');
      }, 500);

      // Mostrar el mensaje
      setTimeout(() => {
        messageBox.classList.add('visible');
        animationState = 'finished';
      }, 2000);
    }

    // Loop gráfico continuo
    function loop() {
      ctx.clearRect(0, 0, width, height);

      // 1. Partículas ambientales doradas
      ambientBokeh.forEach(b => {
        b.alpha += b.pulse;
        if (b.alpha > 0.75 || b.alpha < 0.2) b.pulse *= -1;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 240, 138, ${b.alpha})`;
        ctx.fill();
      });

      // 2. Cohetes subiendo
      if (animationState === 'launching') {
        rockets.forEach(r => {
          r.trail.push({ x: r.x, y: r.y, alpha: 1 });
          r.y -= r.speed;

          r.trail.forEach(t => {
            t.alpha -= 0.06;
            ctx.beginPath();
            ctx.arc(t.x + (Math.random() - 0.5) * 3, t.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(250, 204, 21, ${t.alpha})`;
            ctx.fill();
          });
          r.trail = r.trail.filter(t => t.alpha > 0);

          ctx.beginPath();
          ctx.arc(r.x, r.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.shadowBlur = 0;

          if (r.y <= r.targetY) {
            explode(width * 0.5, height * 0.44);
            rockets = [];
          }
        });
      }

      // 3. Chispas de la detonación
      if (particles.length > 0) {
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
          p.alpha -= p.decay;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1;
        });
        particles = particles.filter(p => p.alpha > 0);
      }

      // 4. Destellos mágicos al tocar la pantalla
      sparkles.forEach(sp => {
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.alpha -= 0.035;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 240, 138, ${sp.alpha})`;
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      });
      sparkles = sparkles.filter(sp => sp.alpha > 0);

      requestAnimationFrame(loop);
    }
    loop();

    // Toques en pantalla interactivos
    function addSparkles(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.2;
        sparkles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 1,
          alpha: 1
        });
      }
    }

    container.addEventListener('click', addSparkles);
    container.addEventListener('touchstart', addSparkles);

    // Controles
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      bgMusic.muted = isMuted;
      soundBtn.textContent = isMuted ? '🔇' : '🔊';
    });

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      bgMusic.currentTime = 0;
      bgMusic.play().catch(() => {});
      startFireworks();
    });

    fullBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
